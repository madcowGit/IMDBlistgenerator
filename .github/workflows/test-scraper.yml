name: Test IMDb Scraper

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test-scraper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker Image
        run: |
          docker build -t imdb-stevenlu-api .

      - name: Run Container
        run: |
          docker run -d --name imdb-api-container -p 8000:8000 --shm-size=2g imdb-stevenlu-api
          sleep 5

      - name: Test Scraper API Endpoint
        run: |
          RESPONSE=$(curl -s "http://localhost:8000/api/scrape?url=https://www.imdb.com/chart/top/")
          echo "API Response:"
          echo "$RESPONSE" | head -c 1000
          
          if echo "$RESPONSE" | grep -q '"imdb_id":\s*"tt'; then
            echo "Successfully scraped IMDb list and validated JSON output structure!"
          else
            echo "Failed to retrieve expected movie items from IMDb API."
            exit 1
          fi

      - name: Container Logs on Failure
        if: failure()
        run: |
          docker logs imdb-api-container