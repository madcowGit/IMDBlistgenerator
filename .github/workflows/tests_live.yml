name: Live Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y scrot xvfb

      - name: Install project
        run: python -m pip install .

      - name: Run tests
        run: xvfb-run python -m unittest discover -s tests -p 'live_*.py' -v