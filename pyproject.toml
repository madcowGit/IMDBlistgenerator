[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "imdb-list-generator"
version = "0.1.0"
description = "Scrape IMDb lists and watchlists into JSON."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask",
    "seleniumbase",
]

[project.optional-dependencies]
dev = [
    "ruff",
]

[project.scripts]
imdb-list-generator = "imdb_list_generator.cli:main"
imdb-list-generator-api = "imdb_list_generator.api:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
